name: Build Caicai Maid Accessory Lab APK

on:
  workflow_dispatch:
  push:
    branches: [ main, agent/v0143-right-ear-sync ]
    paths:
      - 'app/**'
      - 'Core/**'
      - 'Framework'
      - '.gitmodules'
      - 'patches/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply Cubism Android patches
        run: |
          git -C Framework apply --unidiff-zero --check ../patches/cubism-java-no-mipmap.patch
          git -C Framework apply --unidiff-zero ../patches/cubism-java-no-mipmap.patch
          git -C Framework apply --unidiff-zero --check ../patches/cubism-java-drawable-filter.patch
          git -C Framework apply --unidiff-zero ../patches/cubism-java-drawable-filter.patch

      - name: Name APK artifact from app version
        run: |
          version="$(sed -nE "s/^[[:space:]]*versionName '([0-9]+\.[0-9]+\.[0-9]+).*/\1/p" app/build.gradle)"
          test -n "$version"
          echo "APK_ARTIFACT=Caicai-Maid-Live2D-Accessory-Lab-v${version}" >> "$GITHUB_ENV"

      - name: Verify ear placement geometry
        run: |
          gradle :app:testDebugUnitTest --stacktrace
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          reports = list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          assert reports, 'Missing geometry test results'
          total = failures = errors = skipped = 0
          for report in reports:
              root = ET.parse(report).getroot()
              total += int(root.attrib['tests'])
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
          assert total >= 4 and failures == errors == skipped == 0
          print(f'Ear placement geometry: {total} tests passed')
          PYTEST

      - name: Build debug APK
        id: android_build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee android-build.log

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Caicai-Maid-Accessory-Lab-Build-Log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Report failure for repair
        if: steps.android_build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Workflow run ID: ${{ github.run_id }}"
            echo "Commit checked out: $(git rev-parse HEAD)"
            echo
            echo '```text'
            tail -n 180 android-build.log
            echo '```'
          } > build-failure.md
          gh issue create --title "Composite APK build failure · run ${{ github.run_id }}" --body-file build-failure.md

      - uses: actions/upload-artifact@v4
        if: steps.android_build.outcome == 'success'
        with:
          name: ${{ env.APK_ARTIFACT }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Report successful APK
        if: steps.android_build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Composite APK build success · run ${{ github.run_id }}" \
            --body "Caicai Maid accessory lab built successfully from commit $(git rev-parse HEAD). Artifact: ${APK_ARTIFACT}"

      - name: Mark failed build
        if: steps.android_build.outcome == 'failure'
        run: exit 1
